<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>手机食物选择 · 上下布局 · 新版检测器对照</title>
<link rel="stylesheet" href="../shared/experiment-v2.css?v=2.2.0">
<script defer src="../shared/gaze-core.js?v=2.2.0"></script>

<canvas id="stage" aria-label="实验刺激。选择阶段点击更喜欢的图片；也可使用上下方向键。"></canvas>
